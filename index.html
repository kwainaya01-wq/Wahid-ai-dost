<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Complete Soundbox Audio Pack</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ZIP बनाने के लिए JSZip -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        body {
            font-family: sans-serif;
            padding: 15px;
            background: #121212;
            color: #fff;
            text-align: center;
        }

        h3 {
            margin-bottom: 5px;
            color: #4dabf7;
        }

        p {
            font-size: 12px;
            color: #aaa;
            margin-top: 0;
        }

        .section-title {
            font-size: 15px;
            font-weight: bold;
            margin: 20px 0 10px;
            text-align: left;
            color: #ffd43b;
            border-bottom: 1px solid #333;
            padding-bottom: 4px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .btn {
            background: #1e1e1e;
            border: 1px solid #3b82f6;
            color: #fff;
            padding: 10px 4px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 52px;
            box-sizing: border-box;
        }

        .btn:active {
            background: #2563eb;
            transform: scale(0.98);
        }

        .btn span {
            font-size: 10px;
            color: #94a3b8;
            margin-top: 2px;
        }

        .special-btn {
            border-color: #10b981;
            background: #064e3b;
        }

        /* DOWNLOAD ALL */
        #downloadAllBtn {
            width: 100%;
            padding: 14px;
            margin: 15px 0 8px;
            border: 0;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: bold;
        }

        #downloadAllBtn:active {
            transform: scale(0.98);
        }

        #downloadAllBtn:disabled {
            background: #444;
            color: #aaa;
        }

        /* PROGRESS */
        #progressBox {
            display: none;
            margin: 10px 0 15px;
        }

        #progressText {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 6px;
        }

        .progress-bg {
            width: 100%;
            height: 8px;
            background: #333;
            border-radius: 10px;
            overflow: hidden;
        }

        #progressBar {
            width: 0%;
            height: 100%;
            background: #10b981;
            transition: width 0.2s;
        }
    </style>
</head>

<body>

    <h3>Soundbox Hindi Audio Pack</h3>

    <p>
        Tap any button to download direct high-clarity MP3
    </p>

    <!-- DOWNLOAD ALL -->
    <button id="downloadAllBtn" onclick="downloadAll()">
        📦 Download All Audio (107 MP3)
    </button>

    <div id="progressBox">

        <div id="progressText">
            Preparing...
        </div>

        <div class="progress-bg">
            <div id="progressBar"></div>
        </div>

    </div>


    <!-- ============================= -->
    <!-- PHRASES -->
    <!-- ============================= -->

    <div class="section-title">
        📢 Soundbox Phrases (Combined Rupaye)
    </div>

    <div class="grid" id="phrases-grid"></div>


    <!-- ============================= -->
    <!-- NUMBERS -->
    <!-- ============================= -->

    <div class="section-title">
        🔢 Numbers (1 se 99 Complete)
    </div>

    <div class="grid" id="numbers-grid"></div>


<script>

    /* =====================================
       PHRASES
    ===================================== */

    const phrases = [

        {
            file: "v_aapke_account",
            text: "आपके अकाउंट में",
            label: "Account Me"
        },

        {
            file: "v_rupaye_rec_gpay",
            text: "रुपये गूगल पे पर प्राप्त हुए",
            label: "₹ + GPay Praapt"
        },

        {
            file: "v_rupaye_rec_phonepe",
            text: "रुपये फ़ोन पे पर प्राप्त हुए",
            label: "₹ + PhonePe Praapt"
        },

        {
            file: "v_rupaye_rec_paytm",
            text: "रुपये पेटीएम पर प्राप्त हुए",
            label: "₹ + Paytm Praapt"
        },

        {
            file: "v_rupaye_praapt_hue",
            text: "रुपये प्राप्त हुए",
            label: "₹ + Praapt Hue"
        },

        {
            file: "v_sau",
            text: "सौ",
            label: "Sau (100)"
        },

        {
            file: "v_hazaar",
            text: "हज़ार",
            label: "Hazaar (1000)"
        },

        {
            file: "v_laakh",
            text: "लाख",
            label: "Laakh"
        }

    ];


    /* =====================================
       NUMBERS 1 TO 99
    ===================================== */

    const numbers = {

        1:"एक",
        2:"दो",
        3:"तीन",
        4:"चार",
        5:"पाँच",
        6:"छह",
        7:"सात",
        8:"आठ",
        9:"नौ",
        10:"दस",

        11:"ग्यारह",
        12:"बारह",
        13:"तेरह",
        14:"चौदह",
        15:"पंद्रह",
        16:"सोलह",
        17:"सत्रह",
        18:"अठारह",
        19:"उन्नीस",
        20:"बीस",

        21:"इक्कीस",
        22:"बाईस",
        23:"तेईस",
        24:"चौबीस",
        25:"पच्चीस",
        26:"छब्बीस",
        27:"सत्ताईस",
        28:"अट्ठाईस",
        29:"उनतीस",
        30:"तीस",

        31:"इकतीस",
        32:"बत्तीस",
        33:"तैंतीस",
        34:"चौंतीस",
        35:"पैंतीस",
        36:"छत्तीस",
        37:"सैंतीस",
        38:"अड़तीस",
        39:"उनतालीस",
        40:"चालीस",

        41:"इकतालीस",
        42:"बयालीस",
        43:"तैंतालीस",
        44:"चवालीस",
        45:"पैंतालीस",
        46:"छियालीस",
        47:"सैंतालीस",
        48:"अड़तालीस",
        49:"उनचास",
        50:"पचास",

        51:"इक्यावन",
        52:"बावन",
        53:"तिरेपन",
        54:"चौवन",
        55:"पचपन",
        56:"छप्पन",
        57:"सत्तावन",
        58:"अट्ठावन",
        59:"उनसठ",
        60:"साठ",

        61:"इकसठ",
        62:"बासठ",
        63:"तिरेसठ",
        64:"चौंसठ",
        65:"पैंसठ",
        66:"छियासठ",
        67:"सरसठ",
        68:"अड़सठ",
        69:"उनहत्तर",
        70:"सत्तर",

        71:"इकहत्तर",

        73:"तिहत्तर",
        74:"चौहत्तर",
        75:"पचहत्तर",
        76:"छिहत्तर",
        77:"सतहत्तर",
        78:"अठहत्तर",
        79:"उन्नासी",
        80:"अस्सी",

        81:"इक्यासी",
        82:"बयासी",
        83:"तिरासी",
        84:"चौरासी",
        85:"पचासी",
        86:"छियासी",
        87:"सत्तासी",
        88:"अट्ठासी",
        89:"नवासी",
        90:"नब्बे",

        91:"इक्यानवे",
        92:"बानवे",
        93:"तिरानवे",
        94:"चौरानवे",
        95:"पंचानवे",
        96:"छियानवे",
        97:"सत्तानवे",
        98:"अट्ठानवे",
        99:"निन्यानवे"

    };


    /* =====================================
       GOOGLE TTS URL
    ===================================== */

    function getAudioUrl(text) {

        return "https://translate.google.com/translate_tts" +
            "?ie=UTF-8" +
            "&q=" + encodeURIComponent(text) +
            "&tl=hi" +
            "&client=tw-ob";

    }


    /* =====================================
       NORMAL BUTTON
    ===================================== */

    function makeDownloadLink(
        fileName,
        speechText,
        displayTitle,
        displaySub,
        isSpecial = false
    ) {

        const url = getAudioUrl(speechText);

        const a = document.createElement("a");

        a.className =
            isSpecial
            ? "btn special-btn"
            : "btn";

        a.href = url;

        a.download =
            fileName + ".mp3";

        a.target = "_blank";

        a.innerHTML =
            "<b>" + displayTitle + "</b>" +
            "<span>" + displaySub + "</span>";

        return a;
    }


    /* =====================================
       CREATE PHRASE BUTTONS
    ===================================== */

    const phrasesGrid =
        document.getElementById("phrases-grid");

    phrases.forEach(function(p) {

        phrasesGrid.appendChild(

            makeDownloadLink(
                p.file,
                p.text,
                p.label,
                p.text,
                true
            )

        );

    });


    /* =====================================
       CREATE NUMBER BUTTONS
    ===================================== */

    const numbersGrid =
        document.getElementById("numbers-grid");

    for (const [num, text] of Object.entries(numbers)) {

        numbersGrid.appendChild(

            makeDownloadLink(
                "v_" + num,
                text,
                "v_" + num,
                text
            )

        );

    }


    /* =====================================
       DOWNLOAD ALL
    ===================================== */

    async function downloadAll() {

        const button =
            document.getElementById("downloadAllBtn");

        const progressBox =
            document.getElementById("progressBox");

        const progressText =
            document.getElementById("progressText");

        const progressBar =
            document.getElementById("progressBar");


        button.disabled = true;

        button.innerText =
            "⏳ Downloading Audio...";

        progressBox.style.display =
            "block";


        /* -------------------------------
           COMPLETE FILE LIST
        -------------------------------- */

        const files = [];


        /* PHRASES */

        phrases.forEach(function(p) {

            files.push({

                name: p.file + ".mp3",

                text: p.text

            });

        });


        /* NUMBERS */

        for (const [num, text] of Object.entries(numbers)) {

            files.push({

                name: "v_" + num + ".mp3",

                text: text

            });

        }


        /* -------------------------------
           CREATE ZIP
        -------------------------------- */

        const zip =
            new JSZip();


        let success = 0;


        /* -------------------------------
           DOWNLOAD ONE BY ONE
        -------------------------------- */

        for (let i = 0; i < files.length; i++) {

            const file =
                files[i];

            progressText.innerText =
                "Downloading " +
                (i + 1) +
                " / " +
                files.length +
                "  →  " +
                file.name;


            try {

                const response =
                    await fetch(
                        getAudioUrl(file.text)
                    );


                if (!response.ok) {

                    throw new Error(
                        "HTTP " +
                        response.status
                    );

                }


                const audio =
                    await response.blob();


                /*
                   IMPORTANT:
                   Original filename preserved
                */

                zip.file(
                    file.name,
                    audio
                );


                success++;


                const percent =
                    Math.round(
                        ((i + 1) / files.length) * 100
                    );


                progressBar.style.width =
                    percent + "%";


            }

            catch(error) {

                console.log(
                    "Failed:",
                    file.name,
                    error
                );

            }


            /*
               Small delay
               Google requests ko slow rakhta hai
            */

            await new Promise(
                function(resolve) {
                    setTimeout(resolve, 300);
                }
            );

        }


        /* -------------------------------
           MAKE ZIP
        -------------------------------- */

        progressText.innerText =
            "📦 Creating ZIP...";


        try {

            const zipBlob =
                await zip.generateAsync({

                    type: "blob",

                    compression: "DEFLATE",

                    compressionOptions: {
                        level: 6
                    }

                });


            /* ---------------------------
               DOWNLOAD ZIP
            ---------------------------- */

            const url =
                URL.createObjectURL(zipBlob);


            const a =
                document.createElement("a");


            a.href =
                url;


            a.download =
                "Soundbox_Hindi_Audio_Pack.zip";


            document.body.appendChild(a);

            a.click();

            a.remove();


            setTimeout(function() {

                URL.revokeObjectURL(url);

            }, 1000);


            progressText.innerText =
                "✅ Complete! " +
                success +
                " / " +
                files.length +
                " files added.";


            button.innerText =
                "✅ Download Complete";


        }

        catch(error) {

            console.error(error);

            progressText.innerText =
                "❌ ZIP बनाने में समस्या हुई।";

            button.disabled = false;

            button.innerText =
                "📦 Download All Audio (107 MP3)";

        }

    }

</script>

</body>
</html>
